<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RED SCORPION</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --wa-green: #25D366;
      --wa-green-dark: #1ebe57;
      --wa-green-soft: #e9f9ef;
      --text: #1a1a1a;
      --white: #ffffff;
    }

    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background: var(--white);
      text-align: center;
      padding: 40px 20px;
      color: var(--text);
    }

    .logo-text {
      font-size: 28px;
      font-weight: 700;
      color: var(--wa-green);
      margin-bottom: 20px;
    }

    .verified img {
      width: 72px;
      margin: 15px 0;
    }

    .verified h2 {
      font-size: 22px;
      margin: 10px 0 5px;
      font-weight: 700;
    }

    .verified .green {
      color: var(--wa-green);
      font-weight: 600;
    }

    .message {
      background: var(--wa-green-soft);
      border: 1px solid #d9f3e3;
      border-radius: 14px;
      display: inline-block;
      padding: 12px 18px;
      margin: 20px 0;
    }

    .whatsapp-button {
      background-color: var(--wa-green);
      color: #fff;
      padding: 16px 28px;
      border-radius: 999px;
      font-weight: 800;
      font-size: 18px;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-top: 20px;
      cursor: pointer;
      transition: transform .2s ease, box-shadow .2s ease, background-color .2s ease;
      box-shadow: 0 8px 20px rgba(37,211,102,0.25);
    }

    .whatsapp-button i {
      margin-right: 10px;
      font-size: 22px;
    }

    .whatsapp-button:hover {
      transform: translateY(-2px);
      background-color: var(--wa-green-dark);
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(37,211,102,0.45); }
      70% { box-shadow: 0 0 0 18px rgba(37,211,102,0); }
      100% { box-shadow: 0 0 0 0 rgba(37,211,102,0); }
    }
    .pulse { animation: pulse 2.2s infinite; }
  </style>
</head>
<body>
  <div class="logo-text">RED SCORPION</div>

  <section class="verified">
    <img src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg" alt="WhatsApp Logo" />
    <h2>✅ <b>Plataforma Verificada</b> ✅</h2>
    <p class="green">Casino de Confianza</p>
  </section>

  <div class="message">
    Te estamos conectando con nuestro equipo vía WhatsApp.
  </div>

  <!-- BOTÓN -->
  <a
    id="whatsapp-button"
    class="whatsapp-button pulse"
    target="_blank"
    rel="noopener noreferrer"
    href="#"
  >
    <i class="fab fa-whatsapp"></i> ¡QUIERO MI BONO!
  </a>

  <script>
    const whatsappNumbers = [
      "5491151787840", // Número 1
      "5491176294715", // Número 2
      "5491187986444", // Número 3
      "5491142773847", // Número 4
      "5491127626671", // Número 5
      "5491132649467"  // Número 6
    ];

    const message = "quiero mi bono del 20% mi nombre es";
    let currentIndex = 0;

    const whatsappBtn = document.getElementById("whatsapp-button");

    function nextWhatsappUrl() {
      const number = whatsappNumbers[currentIndex];
      const url = `https://wa.me/${number}?text=${encodeURIComponent(message)}`;
      currentIndex = (currentIndex + 1) % whatsappNumbers.length;
      return url;
    }

    if (whatsappBtn) {
      whatsappBtn.setAttribute("href", nextWhatsappUrl());
      whatsappBtn.addEventListener("click", function (e) {
        e.preventDefault();
        const url = nextWhatsappUrl();
        window.open(url, "_blank", "noopener,noreferrer");
      });
    }
  </script>
</body>
</html>
