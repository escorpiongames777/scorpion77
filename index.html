<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Plataforma Verificada</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Meta Pixel Code (SIN CAMBIOS) -->

    if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
    n.queue=[];t=b.createElement(e);t.async=!0;

  <noscript>
    <img height="1" width="1" style="display:none"
      src="https://www.facebook.com/tr?id=24818917464366642&ev=PageView&noscript=1"/>

  <style>
    :root{
      --wa-green: #25D366;
      --wa-green-dark: #1ebe57;
      --wa-green-soft: #e9f9ef;
      --text: #1a1a1a;
      --muted: #6b7280;
      --border: #e5e7eb;
      --white: #ffffff;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background-color: var(--white);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }

    header {
      margin-top: 30px;
      text-align: center;
    }

    .logo-text {
      color: var(--wa-green);
      font-weight: 700;
      font-size: 26px;
    }

    hr {
      width: 100%;
      border: none;
      border-top: 1px solid var(--border);
      margin: 20px 0 10px;
    }

    .verified {
      text-align: center;
      padding-top: 10px;
    }

    .verified img {
      width: 64px;
      height: 64px;
      margin: 12px 0 10px;
    }

    .verified h2 {
      font-size: 22px;
      margin: 6px 0 4px;
      color: var(--text);
      font-weight: 700;
    }

    .verified .green {
      color: var(--wa-green);
      font-weight: 600;
      margin: 0;
    }

    .message {
      background: var(--wa-green-soft);
      padding: 14px 18px;
      border-radius: 14px;
      margin: 22px 0 24px;
      font-size: 16px;
      color: var(--text);
      border: 1px solid #d9f3e3;
      max-width: 640px;
    }

    .whatsapp-button {
      background-color: var(--wa-green);
      color: #ffffff;
      padding: 18px 30px;
      border-radius: 999px;
      font-weight: 800;
      letter-spacing: .3px;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 22px;
      font-size: 18px;
      border: none;
      cursor: pointer;
      position: relative;
      transition: transform .2s ease, box-shadow .2s ease, background-color .2s ease;
      min-width: 260px;
      box-shadow: 0 8px 20px rgba(37,211,102,0.25);
    }

    .whatsapp-button:hover {
      transform: translateY(-2px);
      background-color: var(--wa-green-dark);
      box-shadow: 0 12px 26px rgba(37,211,102,0.32);
    }

    .whatsapp-button:active {
      transform: translateY(0);
    }

    .whatsapp-button i {
      margin-right: 10px;
      font-size: 22px;
    }

    @keyframes pulse {
      0%   { box-shadow: 0 0 0 0 rgba(37, 211, 102, 0.45); }
      70%  { box-shadow: 0 0 0 18px rgba(37, 211, 102, 0); }
      100% { box-shadow: 0 0 0 0 rgba(37, 211, 102, 0); }
    }
    .whatsapp-button.pulse { animation: pulse 2.2s infinite; }

    .clientes {
      background-color: #f3f4f6;
      color: var(--text);
      padding: 12px 20px;
      border-radius: 999px;
      font-weight: 700;
      margin-bottom: 12px;
      border: 1px solid var(--border);
      display: inline-flex;
      align-items: center;
      gap: 10px;
    }
    .clientes::before{
      content:"\\f0c0";
      font: normal 16px/1 "Font Awesome 6 Free";
      font-weight: 900;
      color: var(--text);
      opacity:.85;
    }

    .trustpilot {
      font-size: 14px;
      padding: 12px 16px;
      border: 1px dashed #cbd5e1;
      border-radius: 14px;
      margin-bottom: 18px;
      text-align: center;
      color: var(--muted);
      background: #fafafa;
      max-width: 680px;
    }

    .trustpilot img {
      margin-top: 8px;
      max-width: 160px;
    }

    .footer {
      position: fixed;
      bottom: 0;
      width: 100%;
      background: var(--wa-green);
      color: #ffffff;
      text-align: center;
      padding: 10px;
      font-weight: 800;
      font-size: 14px;
      letter-spacing: .2px;
    }

    @media (max-width: 600px) {
      .whatsapp-button {
        font-size: 16px;
        padding: 16px 24px;
        min-width: 220px;
      }
      .clientes {
        font-size: 14px;
        padding: 10px 16px;
      }
      .message {
        font-size: 14px;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="logo-text">RED SCORPION</div>
  </header>

  <hr />

  <section class="verified">
    <a href="#" target="_blank" onclick="fbq('trackCustom', 'ClickWhatsApp')">
      <img src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg" alt="WhatsApp Logo" width="64" height="64" />
    </a>
    <h2>✅ <b>Plataforma Verificada</b> ✅</h2>
    <p class="green">Casino de Confianza</p>
  </section>

  <div class="message">
    Te estamos conectando con nuestro equipo vía WhatsApp.
  </div>

  <script>
    // Lista de líneas para rotación
    const whatsappNumbers = [
      "5491151787840", // Número 1
      "5491126294715", // Número 2
      "5491187986444", // Número 3
      "5491142773847", // Número 4
      "5491127626671", // Número 5
      "5491132649467"  // Número 6
    ];

    // Mensaje deseado
    const message = "quiero mi bono del 20% mi nombre es";

    let currentIndex = 0;
    const whatsappBtn = document.getElementById("whatsapp-button");

    function nextWhatsappUrl() {
      const number = whatsappNumbers[currentIndex];
      const url = `https://wa.me/${number}?text=${encodeURIComponent(message)}`;
      currentIndex = (currentIndex + 1) % whatsappNumbers.length;
      return url;
    }

    if (whatsappBtn) {
      // Inicializa el href para el primer click
      whatsappBtn.setAttribute("href", nextWhatsappUrl());

      // En cada click rota y abre en nueva pestaña de forma segura
      whatsappBtn.addEventListener("click", function (e) {
        e.preventDefault();
        const url = nextWhatsappUrl();
        try { fbq('trackCustom', 'ClickWhatsApp'); } catch (err) {}
        window.open(url, "_blank", "noopener,noreferrer");
      });
    }
  </script>
</body>
</html>
